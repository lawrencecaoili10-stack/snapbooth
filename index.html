<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Snapbooth</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>

  <main class="app">

    <!-- ======================================================
         CAMERA
         ====================================================== -->

    <section class="camera-section">

      <div class="camera-container">

        <video
          id="video"
          autoplay
          playsinline
          muted
        ></video>

        <canvas
          id="overlayCanvas"
        ></canvas>

        <div
          id="countdown"
          class="countdown hidden"
        ></div>

        <div
          id="flash"
          class="flash"
        ></div>

      </div>


      <canvas
        id="captureCanvas"
        class="hidden"
      ></canvas>


      <div
        id="statusMsg"
        class="status"
      ></div>


      <!-- ==================================================
           CONTROLS
           ================================================== -->

      <div class="controls">

        <button
          id="captureBtn"
          type="button"
        >
          TAKE PHOTO
        </button>


        <button
          id="switchCamBtn"
          type="button"
        >
          SWITCH CAMERA
        </button>


        <button
          id="downloadBtn"
          type="button"
          class="hidden"
        >
          DOWNLOAD
        </button>

      </div>

    </section>


    <!-- ======================================================
         THEMES
         ====================================================== -->

    <section class="themes">

      <h2>Choose a Theme</h2>

      <div
        id="themeList"
        class="theme-list"
      ></div>

    </section>

  </main>


  <script src="script.js"></script>

</body>

</html>
